<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
    #result:empty { display: none; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <pre id="result" aria-live="polite"></pre>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены", other: "Другое" };

    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const result = document.querySelector("#result");

    function show(text, { isError = false } = {}) {
      result.textContent = text;
      result.classList.toggle("error", isError);
    }

    function showReady({ topic, draft }) {
      const label = TOPIC_LABELS[topic] ?? topic;
      show(`Тема: ${label}\n\nЧерновик ответа:\n${draft}`);
    }

    function showManualReview() {
      // textContent заменяется целиком — предыдущий черновик на экране не остаётся.
      show("AI не справился с заявкой. Передайте её на ручной разбор и ответьте клиенту самостоятельно.", { isError: true });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (message.value.trim() === "") {
        show("Введите текст заявки.", { isError: true });
        message.focus();
        return;
      }

      button.disabled = true;
      const originalLabel = button.textContent;
      button.textContent = "Разбираю…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        const data = await reply.json();

        if (reply.status === 400 && data.status === "invalid_input") {
          show("Введите текст заявки.", { isError: true });
        } else if (reply.status === 200 && data.status === "ready") {
          showReady(data);
        } else if (reply.status === 200 && data.status === "manual_review") {
          showManualReview();
        } else {
          showManualReview();
        }
      } catch {
        show("Не удалось связаться с сервером. Попробуйте ещё раз или разберите заявку вручную.", { isError: true });
      } finally {
        button.disabled = false;
        button.textContent = originalLabel;
      }
    });
  </script>
</body>
</html>
